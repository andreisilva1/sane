[package]
name = "sane"
version = "0.4.0"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sane_lib"
crate-type = ["lib"]

[[bin]]
name = "sane"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
