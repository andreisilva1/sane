<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Output — Sane</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0f1117;
      --bg-hdr:  #0d0f14;
      --border:  #1c2230;
      --text:    #c4d0dc;
      --text-dim:#4c5c6e;
      --accent:  #4d8fd4;
      --success: #4caf70;
      --error:   #e05555;
      --warning: #c89030;
      --font:    'Cascadia Code', 'Fira Code', 'JetBrains Mono', 'Consolas', monospace;
      --font-ui: system-ui, -apple-system, 'Segoe UI', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 12px;
      overflow: hidden;
      user-select: none;
    }

    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    #fo-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      min-height: 32px;
      background: var(--bg-hdr);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      -webkit-app-region: drag;
    }

    #fo-status {
      flex: 1;
      font-size: 11px;
      font-family: var(--font-ui);
      color: var(--text-dim);
      letter-spacing: 0.02em;
      -webkit-app-region: no-drag;
    }
    #fo-status.running  { color: var(--accent); }
    #fo-status.finished { color: var(--success); }
    #fo-status.error    { color: var(--error); }
    #fo-status.killed   { color: var(--warning); }

    #fo-duration {
      font-size: 10px;
      font-family: var(--font-ui);
      color: var(--text-dim);
      -webkit-app-region: no-drag;
    }

    .fo-btn {
      background: transparent;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      font-family: var(--font-ui);
      font-size: 11px;
      padding: 1px 5px;
      line-height: 1;
      transition: color 0.12s;
      -webkit-app-region: no-drag;
    }
    .fo-btn:hover { color: var(--text); }
    #fo-close { font-size: 15px; padding: 0 3px; }

    #fo-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
      white-space: pre-wrap;
      word-break: break-all;
      line-height: 1.6;
      user-select: text;
    }

    #fo-output::-webkit-scrollbar       { width: 4px; }
    #fo-output::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .fo-empty  { color: var(--text-dim); font-style: italic; }
    .fo-info   { color: var(--text-dim); font-style: italic; }
    .fo-stdout { color: var(--text); }
    .fo-stderr { color: var(--error); }
    .fo-file   { color: var(--warning); font-size: 10px; display: block;
                 margin-bottom: 4px; opacity: 0.7; }
  </style>
</head>
<body>
  <div id="container">
    <div id="fo-header">
      <span id="fo-status">—</span>
      <span id="fo-duration"></span>
      <button class="fo-btn" id="fo-clear" title="Clear">clear</button>
      <button class="fo-btn" id="fo-close" title="Close">×</button>
    </div>
    <div id="fo-output">
      <span class="fo-empty">Waiting for output…</span>
    </div>
  </div>

  <script>
    const elStatus   = document.getElementById('fo-status');
    const elDuration = document.getElementById('fo-duration');
    const elOutput   = document.getElementById('fo-output');

    function setStatus(s, ms) {
      elStatus.className = s;
      elStatus.textContent =
        s === 'running'  ? 'Running…' :
        s === 'finished' ? 'Finished' :
        s === 'killed'   ? 'Killed'   :
        s === 'error'    ? 'Error'    : '—';
      elDuration.textContent =
        ms != null ? (ms < 1000 ? `${ms}ms` : `${(ms / 1000).toFixed(2)}s`) : '';
    }

    function clearOutput() {
      elOutput.innerHTML = '';
    }

    function append(cls, text) {
      if (!text) return;
      const el = document.createElement('span');
      el.className   = cls;
      el.textContent = text;
      elOutput.appendChild(el);
      elOutput.scrollTop = elOutput.scrollHeight;
    }

    document.getElementById('fo-clear').addEventListener('click', () => {
      clearOutput();
      setStatus('', null);
    });

    document.getElementById('fo-close').addEventListener('click', async () => {
      const { getCurrentWindow } = window.__TAURI__.window;
      await getCurrentWindow().close();
    });

    (async () => {
      const { listen }           = window.__TAURI__.event;
      const { getCurrentWindow } = window.__TAURI__.window;

      const win = getCurrentWindow();

      try { await win.setAlwaysOnTop(true); } catch {}

      async function saveGeometry() {
        try {
          const pos  = await win.outerPosition();
          const size = await win.outerSize();
          localStorage.setItem('sane_float_geo_v1', JSON.stringify({
            x: pos.x, y: pos.y, width: size.width, height: size.height,
          }));
        } catch {}
      }

      await win.listen('tauri://move',   saveGeometry);
      await win.listen('tauri://resize', saveGeometry);

      // Code started running — clear and show running state
      await listen('fo-status', (e) => {
        const { status, file } = e.payload;
        if (status !== 'running') return;
        clearOutput();
        if (file) {
          append('fo-file', file.replace(/\\/g, '/').split('/').pop() + '\n');
        }
        setStatus('running', null);
      });

      // Live line streaming
      await listen('fo-line', (e) => {
        const { type, text } = e.payload;
        append(type === 'stderr' ? 'fo-stderr' : 'fo-stdout', text + '\n');
      });

      // Final result — update status and duration
      await listen('fo-result', (e) => {
        const { status, duration } = e.payload;
        if (!elOutput.querySelector('.fo-stdout, .fo-stderr')) {
          append('fo-info', '(no output)\n');
        }
        setStatus(status, duration);
      });
    })();
  </script>
</body>
</html>
